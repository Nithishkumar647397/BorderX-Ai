<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORDER-X Surveillance Dashboard</title>
    <!-- Google Fonts: Rajdhani for technical/display, Outfit for clean body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Command Center Palette */
            --bg-color: #070b14;
            --panel-bg: #0d1322;
            --panel-border: #1a243a;
            
            /* Typography Colors */
            --text-primary: #e2e8f0;
            --text-muted: #64748b;
            
            /* Risk Colors */
            --color-normal: #10b981;
            --color-attention: #f59e0b;
            --color-high: #ef4444;

            /* Core Fonts */
            --font-display: 'Rajdhani', sans-serif;
            --font-body: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-body);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        /* --------------------------
           HEADER
           -------------------------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 60px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
        }
        
        .logo span {
            color: var(--color-normal);
        }

        .clock {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--color-normal);
            box-shadow: 0 0 8px var(--color-normal);
        }

        /* --------------------------
           LAYOUT GRID
           -------------------------- */
        .main-content {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        .camera-grid {
            flex: 7; /* ~70% width */
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
        }

        .sidebar {
            flex: 3; /* ~30% width */
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 300px;
        }

        /* --------------------------
           PANELS & CARDS
           -------------------------- */
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--panel-border);
            text-transform: uppercase;
        }

        /* --------------------------
           CAMERA TILES
           -------------------------- */
        .camera-tile {
            position: relative;
            background-color: #05080f;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .camera-view {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #0d1526 0%, #05080f 100%);
            overflow: hidden;
        }

        /* Animated Scan Line */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20%;
            background: linear-gradient(to bottom, transparent 0%, rgba(16, 185, 129, 0.05) 50%, rgba(16, 185, 129, 0.2) 100%);
            animation: scan 4s linear infinite;
            border-bottom: 1px solid rgba(16, 185, 129, 0.3);
            pointer-events: none;
        }

        /* Overlay Grid */
        .camera-view::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(26, 36, 58, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(26, 36, 58, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .camera-meta {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }

        .camera-label {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(13, 19, 34, 0.8);
            padding: 4px 8px;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
        }

        .live-badge {
            align-self: flex-start;
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 700;
            color: var(--bg-color);
            background-color: var(--color-normal);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* --------------------------
           RISK OVERVIEW
           -------------------------- */
        .risk-overview {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .risk-bar-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .risk-label {
            width: 80px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }

        .risk-track {
            flex: 1;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .risk-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%; /* Animates via JS */
        }

        .fill-normal { background-color: var(--color-normal); }
        .fill-attention { background-color: var(--color-attention); }
        .fill-high { background-color: var(--color-high); }

        .risk-value {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            width: 30px;
            text-align: right;
        }

        /* --------------------------
           EVENT FEED
           -------------------------- */
        .alert-feed-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .alert-feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Custom Scrollbar */
        .alert-feed::-webkit-scrollbar { width: 6px; }
        .alert-feed::-webkit-scrollbar-track { background: var(--panel-bg); }
        .alert-feed::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

        .alert-item {
            background-color: rgba(26, 36, 58, 0.3);
            border-left: 4px solid var(--color-normal);
            border-radius: 4px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .alert-item.exiting {
            opacity: 0;
            transform: scale(0.95);
        }

        .alert-item[data-level="High"] {
            border-left-color: var(--color-high);
            background-color: rgba(239, 68, 68, 0.05);
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards, pulseDanger 2s infinite ease-in-out 0.4s;
        }

        .alert-item[data-level="Elevated"] {
            border-left-color: var(--color-attention);
            background-color: rgba(245, 158, 11, 0.05);
        }

        .alert-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-time {
            font-family: var(--font-display);
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .alert-badge {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }

        .badge-high { background-color: var(--color-high); }
        .badge-attention { background-color: var(--color-attention); }
        .badge-normal { background-color: var(--color-normal); }

        .alert-body {
            font-size: 14px;
            line-height: 1.4;
        }
        
        .alert-body strong {
            font-family: var(--font-display);
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        /* --------------------------
           FOOTER STRIP
           -------------------------- */
        .system-strip {
            height: 40px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 32px;
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .system-strip div span {
            color: var(--text-primary);
        }
        
        .system-strip #net-status {
            color: var(--color-normal);
        }

        /* --------------------------
           ANIMATIONS
           -------------------------- */
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(500%); }
        }

        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulseDanger {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); }
            50% { box-shadow: 0 0 15px 0 rgba(239, 68, 68, 0.1); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">BORDER<span>-</span>X</div>
        <div class="clock" id="live-clock">00:00:00</div>
        <div class="system-status">
            <div class="status-dot"></div>
            OPERATIONAL
        </div>
    </header>

    <!-- Main Grid -->
    <div class="main-content">
        <!-- Cameras -->
        <div class="camera-grid">
            <div class="camera-tile">
                <div class="camera-meta">
                    <div class="camera-label">CAM-01 / NORTH SECTOR</div>
                    <div class="live-badge">LIVE</div>
                </div>
                <div class="camera-view"><div class="scanline"></div></div>
            </div>
            <div class="camera-tile">
                <div class="camera-meta">
                    <div class="camera-label">CAM-02 / EAST GATE</div>
                    <div class="live-badge" style="background-color: var(--color-attention);">DETECT</div>
                </div>
                <div class="camera-view" style="animation-delay: -1s;"><div class="scanline"></div></div>
            </div>
            <div class="camera-tile">
                <div class="camera-meta">
                    <div class="camera-label">CAM-03 / WEST PERIMETER</div>
                    <div class="live-badge">LIVE</div>
                </div>
                <div class="camera-view" style="animation-delay: -2s;"><div class="scanline"></div></div>
            </div>
            <div class="camera-tile">
                <div class="camera-meta">
                    <div class="camera-label">CAM-04 / MAIN CHECKPOINT</div>
                    <div class="live-badge">LIVE</div>
                </div>
                <div class="camera-view" style="animation-delay: -3s;"><div class="scanline"></div></div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="panel">
                <div class="panel-header">Risk Overview (Last 1H)</div>
                <div class="risk-overview">
                    <div class="risk-bar-container">
                        <div class="risk-label">High Risk</div>
                        <div class="risk-track"><div class="risk-fill fill-high" id="bar-high"></div></div>
                        <div class="risk-value" id="val-high">0</div>
                    </div>
                    <div class="risk-bar-container">
                        <div class="risk-label">Attention</div>
                        <div class="risk-track"><div class="risk-fill fill-attention" id="bar-attention"></div></div>
                        <div class="risk-value" id="val-attention">0</div>
                    </div>
                    <div class="risk-bar-container">
                        <div class="risk-label">Normal</div>
                        <div class="risk-track"><div class="risk-fill fill-normal" id="bar-normal"></div></div>
                        <div class="risk-value" id="val-normal">0</div>
                    </div>
                </div>
            </div>

            <div class="panel alert-feed-wrapper">
                <div class="panel-header">Live Event Feed</div>
                <div class="alert-feed" id="alert-feed">
                    <!-- Events will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="system-strip">
        <div>NETWORK: <span id="net-status">ONLINE</span></div>
        <div>SYNC QUEUE: <span id="sync-queue">0</span></div>
        <div>ACTIVE CAMERAS: <span>4/4</span></div>
        <div>TRACKED ENTITIES: <span id="tracked-count">0</span></div>
    </footer>

    <script>
        /* =====================================================================
           MODULE 1: UI RENDERER & LOGIC
           This section handles updating the DOM, animating numbers, and injecting
           new events. It acts identically to what a WebSocket client would do.
           ===================================================================== */
        
        const UI = {
            feedElement: document.getElementById('alert-feed'),
            maxFeedItems: 20,
            
            // State for risk bars to manage animations
            riskCounts: { High: 0, Elevated: 0, Normal: 0 },
            
            // Helper to animate numbers counting up
            animateNumber(elementId, newValue) {
                const el = document.getElementById(elementId);
                const startValue = parseInt(el.innerText) || 0;
                if (startValue === newValue) return;

                const duration = 600;
                let startTimestamp = null;
                
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    // ease out quad
                    const easeProgress = progress * (2 - progress); 
                    el.innerText = Math.floor(easeProgress * (newValue - startValue) + startValue);
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        el.innerText = newValue;
                    }
                };
                window.requestAnimationFrame(step);
            },

            updateRiskBars() {
                const total = Math.max(1, this.riskCounts.High + this.riskCounts.Elevated + this.riskCounts.Normal);
                
                // Update Bars
                document.getElementById('bar-high').style.width = `${(this.riskCounts.High / total) * 100}%`;
                document.getElementById('bar-attention').style.width = `${(this.riskCounts.Elevated / total) * 100}%`;
                document.getElementById('bar-normal').style.width = `${(this.riskCounts.Normal / total) * 100}%`;

                // Animate Numbers
                this.animateNumber('val-high', this.riskCounts.High);
                this.animateNumber('val-attention', this.riskCounts.Elevated);
                this.animateNumber('val-normal', this.riskCounts.Normal);
            },

            addEvent(eventData) {
                // Update risk overview counts based on event
                if (eventData.risk_level === 'High') this.riskCounts.High++;
                else if (eventData.risk_level === 'Elevated') this.riskCounts.Elevated++;
                else this.riskCounts.Normal++;
                
                this.updateRiskBars();

                // Build DOM Element
                const item = document.createElement('div');
                item.className = 'alert-item';
                item.setAttribute('data-level', eventData.risk_level || 'Normal');
                
                let badgeClass = 'badge-normal';
                if (eventData.risk_level === 'High') badgeClass = 'badge-high';
                if (eventData.risk_level === 'Elevated') badgeClass = 'badge-attention';

                // Format time: HH:MM:SS
                const d = new Date(eventData.timestamp);
                const timeStr = d.toLocaleTimeString('en-US', { hour12: false });

                // Format message based on type
                let title = '';
                let desc = '';
                
                if (eventData.type === 'zone_crossing') {
                    title = `Track ID: ${eventData.track_id}`;
                    desc = `Entity entered restricted zone.`;
                } else if (eventData.type === 'loitering_detected') {
                    title = `Track ID: ${eventData.track_id} — Loitering`;
                    desc = `Entity stationary for ${eventData.duration}s.`;
                } else if (eventData.type === 'risk_escalation') {
                    title = `System Escalation`;
                    desc = eventData.details || `Risk level escalated to ${eventData.risk_level}.`;
                } else {
                    title = `System Event`;
                    desc = `Unknown event type recorded.`;
                }

                item.innerHTML = `
                    <div class="alert-meta">
                        <span class="alert-time">${timeStr}</span>
                        <span class="alert-badge ${badgeClass}">${eventData.risk_level}</span>
                    </div>
                    <div class="alert-body">
                        <strong>${title}</strong><br>
                        <span style="color: var(--text-muted)">${desc}</span>
                    </div>
                `;

                // Prepend and enforce max items
                this.feedElement.insertBefore(item, this.feedElement.firstChild);

                if (this.feedElement.children.length > this.maxFeedItems) {
                    const lastChild = this.feedElement.lastChild;
                    lastChild.classList.add('exiting');
                    setTimeout(() => {
                        if (lastChild.parentNode) {
                            this.feedElement.removeChild(lastChild);
                        }
                    }, 300); // Wait for CSS transition
                }
            },

            updateHeartbeat(data) {
                this.animateNumber('tracked-count', data.people_count);
            },

            startClock() {
                setInterval(() => {
                    document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false });
                }, 1000);
            }
        };

        // Initialize clock
        UI.startClock();


        /* =====================================================================
           MODULE 2: STANDALONE DATA SIMULATOR
           This replaces the real WebSocket feed. It generates fake events 
           matching the Python API signature and sends them to the UI renderer.
           ===================================================================== */
        
        class BorderXSimulator {
            constructor(uiController) {
                this.ui = uiController;
                this.trackIdCounter = 100;
                this.activeTracks = 0;
            }

            start() {
                // Heartbeat simulation (every 1s)
                setInterval(() => {
                    // Fluctuate tracked people randomly
                    if (Math.random() > 0.7) {
                        this.activeTracks += Math.floor(Math.random() * 3) - 1;
                        this.activeTracks = Math.max(0, this.activeTracks);
                    }
                    
                    this.ui.updateHeartbeat({
                        type: "heartbeat",
                        timestamp: new Date().toISOString(),
                        people_count: this.activeTracks,
                        camera_status: "online"
                    });
                }, 1000);

                // Event simulation loop (random intervals)
                this.scheduleNextEvent();
            }

            scheduleNextEvent() {
                // Random delay between 2 and 5 seconds
                const delay = Math.random() * 3000 + 2000;
                setTimeout(() => {
                    this.generateRandomEvent();
                    this.scheduleNextEvent();
                }, delay);
            }

            generateRandomEvent() {
                const rand = Math.random();
                let event = {
                    timestamp: new Date().toISOString()
                };

                // 60% chance Zone Crossing, 30% chance Risk Escalation, 10% chance Loitering
                if (rand < 0.6) {
                    this.trackIdCounter++;
                    event.type = "zone_crossing";
                    event.track_id = this.trackIdCounter;
                    event.risk_level = Math.random() > 0.8 ? "Elevated" : "Normal";
                    event.risk_score = event.risk_level === "Elevated" ? 60 : 20;
                } 
                else if (rand < 0.9) {
                    event.type = "risk_escalation";
                    event.risk_level = "Elevated";
                    event.details = "Unexpected movement pattern detected.";
                } 
                else {
                    event.type = "loitering_detected";
                    event.track_id = this.trackIdCounter - Math.floor(Math.random() * 5); // Pick a recent ID
                    event.duration = Math.floor(Math.random() * 30 + 90); // 90 to 120s
                    event.risk_level = "High";
                    event.risk_score = 95;
                }

                // Send to UI (Mocking a websocket onmessage)
                this.ui.addEvent(event);
            }
        }

        // Boot Simulator
        const sim = new BorderXSimulator(UI);
        sim.start();
        
        // Push a few initial events so it doesn't look empty on load
        setTimeout(() => { UI.addEvent({ type: "zone_crossing", track_id: 98, risk_level: "Normal", timestamp: new Date().toISOString() }); }, 500);
        setTimeout(() => { UI.addEvent({ type: "zone_crossing", track_id: 99, risk_level: "Elevated", timestamp: new Date().toISOString() }); }, 1200);

    </script>
</body>
</html>
